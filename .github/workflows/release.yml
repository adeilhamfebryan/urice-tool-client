name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          $source = "C:\Program Files\Tesseract-OCR"
          $target = Join-Path $env:RUNNER_TEMP "tesseract_portable"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$source\tesseract.exe" -Destination $target -Force
          Copy-Item "$source\tessdata" -Destination $target -Recurse -Force
          Get-ChildItem "$source" -Filter "*.dll" | Copy-Item -Destination $target -Force
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ind.traineddata" -OutFile (Join-Path $target "tessdata\ind.traineddata")
          "TESSERACT_PORTABLE_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Python sidecar
        shell: powershell
        run: |
          python -m PyInstaller --onefile --clean `
            --name urice-engine-x86_64-pc-windows-msvc `
            --distpath "backend\dist" `
            --workpath "backend\build" `
            --specpath "backend" `
            --add-data "$env:TESSERACT_PORTABLE_DIR;tesseract_portable" `
            "backend\engine.py"

      - name: Load updater signing secrets
        shell: powershell
        run: |
          $key = @'
          ${{ secrets.ANAK }}
          '@
          $key = $key.Trim().Trim([char]0xFEFF)
          "TAURI_SIGNING_PRIVATE_KEY<<__TAURI_KEY__" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $key | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "__TAURI_KEY__" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.YATIM }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "URice Tools Client v__VERSION__"
          releaseBody: "URice Tools Client release. Download and run the Windows setup installer."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
